# Configuración NO sensible del ambiente local.
# El usuario y la contraseña de Oracle van en local-secure-application-config.yaml.
http:
  listener:
    host: "0.0.0.0"
    port: "8091"
    basePath: "/api/v1/core/store"

db:
  # Oracle en el contenedor local (servicio FREEPDB1, esquema STORE_APP)
  url: "jdbc:oracle:thin:@//localhost:1521/FREEPDB1"
  driverClassName: "oracle.jdbc.OracleDriver"
  pool:
    minPoolSize: "1"
    maxPoolSize: "5"
  reconnection:
    frequencyMillis: "2000"
    attempts: "3"

# Segundos que se sugieren al consumidor en el header Retry-After cuando Oracle no está disponible
error:
  retryAfterSeconds: "30"
