# Dependencias locales de la PoC «Integración en la era agéntica» (proyecto poc-infra).
#
# Perfiles:
#   erp          Oracle (esquemas STORE_APP e INTEGRATION_APP)
#   integracion  Oracle y RabbitMQ
#   logistica    SFTP y simulador de logística
#   proveedores  WireMock con los proveedores A, B y C
#   local        todo
#
# Arranque: infra/scripts/start-infra.ps1 o .sh (genera semillas y la llave SFTP, levanta y crea usuarios).
# Reinicio de datos: infra/scripts/reset-data.ps1 o .sh. Control de la demo: demo/control.ps1 o .sh.
#
# Los contenedores llevan el prefijo poc-. No tocan `oracle-store`, `ngrok-oracle` ni los `tih-*` de la base.
# Los puertos se cambian en infra/.env (ver .env.example).

name: poc-infra

services:
  poc-oracle:
    profiles: ["erp", "integracion", "local"]
    image: container-registry.oracle.com/database/free:latest
    container_name: poc-oracle
    hostname: poc-oracle
    ports:
      - "${ORACLE_PORT:-1523}:1521"
    env_file:
      - ./oracle/credentials.local   # ORACLE_PWD, APP_USER, APP_USER_PASSWORD, INT_USER, INT_USER_PASSWORD
    volumes:
      - poc-oracle-data:/opt/oracle/oradata
      - ./oracle/init:/opt/oracle/scripts/startup:ro   # crea los dos esquemas; idempotente
      - ./oracle/sql:/opt/oracle/poc-sql:ro            # erp/, integration/ y verify/
    healthcheck:
      test: ["CMD", "/opt/oracle/checkDBStatus.sh"]
      interval: 20s
      timeout: 20s
      retries: 30
      start_period: 120s
    restart: unless-stopped

  # Proveedores A (REST, estilo Fakestore), B (REST, estilo Escuelajs) y C (SOAP) simulados.
  # Los mappings los genera data/tools/build-seeds.mjs desde data/scenario.json.
  # El retardo del proveedor C se cambia por la API de administración (/__admin): demo/control slow-c | normal-c.
  poc-wiremock:
    profiles: ["proveedores", "local"]
    image: wiremock/wiremock:3.9.1
    container_name: poc-wiremock
    hostname: poc-wiremock
    command: ["--disable-banner"]
    ports:
      - "${WIREMOCK_PORT:-8089}:8080"
    volumes:
      - ./wiremock/mappings:/home/wiremock/mappings:ro
      - ./wiremock/__files:/home/wiremock/__files:ro
    restart: unless-stopped

  # Mensajería de la integración: orders.events con order.registered, approval.requested y correction.applied (cada una con DLQ).
  # start-infra crea los usuarios de rabbitmq/credentials.local.
  poc-rabbitmq:
    profiles: ["integracion", "local"]
    image: rabbitmq:3.13-management
    container_name: poc-rabbitmq
    hostname: poc-rabbitmq
    ports:
      - "${RABBITMQ_PORT:-5673}:5672"            # AMQP
      - "${RABBITMQ_CONSOLE_PORT:-15673}:15672"  # consola web
    volumes:
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 10s
      timeout: 10s
      retries: 12
    restart: unless-stopped

  # SFTP de logística: usuario pocsftp solo con llave (sin contraseña, D21). Carpetas /despachos/pendientes, firmadas y rechazadas.
  poc-sftp:
    profiles: ["logistica", "local"]
    image: atmoz/sftp:alpine
    container_name: poc-sftp
    hostname: poc-sftp
    command: ["pocsftp::1001"]
    ports:
      - "${SFTP_PORT:-2223}:22"
    volumes:
      - poc-sftp-data:/home/pocsftp/despachos
      - ./sftp/keys/poc_sftp_rsa.pub:/home/pocsftp/.ssh/keys/poc_sftp_rsa.pub:ro
      - ./sftp/docker/create-dispatch-dirs.sh:/etc/sftp.d/create-dispatch-dirs.sh:ro
    restart: unless-stopped

  # Operador de logística simulado (D12): firma o rechaza lo que llega a pendientes y deja el acuse.
  poc-logistics-sim:
    profiles: ["logistica", "local"]
    image: alpine:3.20
    container_name: poc-logistics-sim
    hostname: poc-logistics-sim
    command: ["sh", "/sim/sim.sh"]
    environment:
      DESPACHOS: /despachos
      RULES: /rules/logistics-rules.json
      INTERVAL: "5"
    volumes:
      - poc-sftp-data:/despachos
      - ../demo/logistics-sim:/sim:ro
      - ../data:/rules:ro
    depends_on:
      - poc-sftp
    restart: unless-stopped

volumes:
  poc-oracle-data:
  poc-sftp-data:
