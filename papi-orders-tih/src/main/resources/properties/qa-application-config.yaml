# Ambiente QA: copia inicial de dev.
# Cambiar hosts, puertos y demas valores antes de usar este ambiente.
# Configuración del ambiente local. client_id/client_secret son placeholders: la política
# Client ID Enforcement solo existe en API Manager (no se usa en local).
http:
  listener:
    host: "0.0.0.0"
    port: "8083"
    basePath: "/api/v1/orders-management"

# Callers de esta Process API. Todos en localhost; los puertos son los del plan.
papi:
  customers:
    host: "localhost"
    port: "8082"
    basePath: "/api/v1/customers-management"
sapi:
  sftpOrders:
    host: "localhost"
    port: "8092"
    basePath: "/api/v1/sftp/orders"
  oracleCore:
    host: "localhost"
    port: "8091"
    basePath: "/api/v1/core/store"
  priceProviders:
    host: "localhost"
    port: "8093"
    basePath: "/api/v1/price-providers"
  # Milisegundos de espera por la respuesta de cualquiera de ellas (las cotizaciones salen a internet)
  timeoutMillis: "20000"
  clientId: "local-client-id"
  clientSecret: "local-client-secret"

# Procesamiento programado de pedidos pendientes. initialState "stopped" desactiva el scheduler
# (el disparo manual POST /orders/process sigue funcionando).
scheduler:
  initialState: "started"
  startDelayMillis: "15000"
  frequencyMillis: "60000"

# Segundos que se sugieren al consumidor en Retry-After cuando un backend no está disponible
error:
  retryAfterSeconds: "30"

# RabbitMQ (usuario y clave van en el archivo -secure-application-config.yaml)
rabbitmq:
  host: "localhost"
  port: "5672"
  virtualHost: "/"
  exchange: "orders.events"
  routingKey: "order.registered"
