# Configuration for the local environment (the default one).
http:
  listener:
    host: "0.0.0.0"
    port: "8092"
    basePath: "/api/v1/sftp/orders"

# poc-sftp (infra/docker-compose.yml): user pocsftp, key only (D21). The user is jailed in its home,
# so the logistics folders are /despachos/pendientes, /despachos/firmadas and /despachos/rechazadas.
sftp:
  host: "localhost"
  port: "2223"
  username: "pocsftp"
  # Absolute path of the private key generated by infra/scripts/start-infra (infra/sftp/keys/poc_sftp_rsa, not versioned).
  # It depends on where the repo is cloned, so pass it when starting the app: -M-Dsftp.identityFile=<repo>/infra/sftp/keys/poc_sftp_rsa
  identityFile: ""
  baseDir: "/despachos"
  folders:
    pending: "pendientes"
    signed: "firmadas"
    rejected: "rechazadas"

# poc-resilience, source sftp (failureThreshold 3 and openMillis 30000 by default). 3 s connection timeout.
rs:
  sftp:
    timeoutMillis: "3000"

# Seconds suggested to the consumer in the Retry-After header when the SFTP is unavailable
error:
  retryAfterSeconds: "30"
