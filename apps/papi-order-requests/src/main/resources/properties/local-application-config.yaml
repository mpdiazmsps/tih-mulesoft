# Configuration for the local environment (the default one). Credentials live in local-secure-application-config.yaml.
http:
  listener:
    host: "0.0.0.0"
    port: "8085"
    basePath: "/api/v1"

# poc-oracle (infra/docker-compose.yml): service FREEPDB1, schema INTEGRATION_APP (the requests store; never STORE_APP).
# Default local port 1523 (override with -M-Ddb.port=<port>).
db:
  host: "localhost"
  port: "1523"
  serviceName: "FREEPDB1"
  pool:
    minPoolSize: "1"
    maxPoolSize: "5"
  reconnection:
    frequencyMillis: "2000"
    attempts: "3"

# papi-orders applies the approved corrections. Locally any client_id/client_secret works.
papi:
  orders:
    protocol: "HTTP"
    host: "localhost"
    port: "8083"
    basePath: "/api/v1/orders-management"
    timeoutMillis: "15000"
    clientId: "papi-order-requests-local"
    clientSecret: "papi-order-requests-local"

# D10: only these client applications (x-client-app header, passed by the Experience API) can approve, reject or retry.
approval:
  approverClientIds: "aprobador-tienda"

requests:
  # A request without a decision expires after this many hours
  expiryHours: "24"
  # The expiry scheduler runs every 5 minutes
  expiryFrequencyMillis: "300000"
  expiryInitialState: "started"
  defaultActor: "unknown-client"
  pageSize: "20"

# RabbitMQ (poc-rabbitmq). approval.requested on creation, correction.applied once on COMPLETED (D18).
rabbitmq:
  host: "localhost"
  port: "5673"
  virtualHost: "/"
  exchange: "orders.events"
  approvalRequestedKey: "approval.requested"
  correctionAppliedKey: "correction.applied"

currency: "MXN"

# Seconds suggested to the consumer in the Retry-After header when a backend is unavailable
error:
  retryAfterSeconds: "30"
