# Configuración del ambiente local. client_id/client_secret son placeholders: la política
# Client ID Enforcement solo existe en API Manager (no se usa en local).
http:
  listener:
    host: "0.0.0.0"
    port: "8084"
    basePath: "/api/v1/notifications"

# APIs que consume esta Process API (todas en localhost; puertos del plan).
papi:
  customers:
    host: "localhost"
    port: "8082"
    basePath: "/api/v1/customers-management"
sapi:
  # Milisegundos de espera por la respuesta de cualquiera de ellas
  timeoutMillis: "20000"
  clientId: "local-client-id"
  clientSecret: "local-client-secret"

# MagicBell (el token va en -secure-application-config.yaml)
magicbell:
  host: "api.magicbell.com"
  port: "443"
  broadcastsPath: "/broadcasts"
  timeoutMillis: "10000"

# Segundos que se sugieren al consumidor en Retry-After cuando un backend no está disponible
error:
  retryAfterSeconds: "30"

# RabbitMQ (usuario y clave van en el archivo -secure-application-config.yaml)
rabbitmq:
  host: "localhost"
  port: "5672"
  virtualHost: "/"
  exchange: "orders.events"
  routingKey: "order.registered"
  queue: "orders.registered.q"
  # Reintentos antes de rechazar el mensaje hacia la DLQ (solo errores transitorios: 5xx, timeout, 503)
  retryMax: "2"
  retryMillis: "2000"
