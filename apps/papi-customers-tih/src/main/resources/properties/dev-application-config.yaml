# Configuración del ambiente local. Sin credenciales reales: client_id/client_secret son placeholders
# porque la política Client ID Enforcement solo existe en API Manager (no se usa en local).
http:
  listener:
    host: "0.0.0.0"
    port: "8082"
    basePath: "/api/v1/customers-management"

# System API de Oracle (sapi-oracle-core-tih)
sapi:
  oracleCore:
    host: "localhost"
    port: "8091"
    basePath: "/api/v1/core/store"
    timeoutMillis: "10000"
    clientId: "local-client-id"
    clientSecret: "local-client-secret"

# Segundos que se sugieren al consumidor en Retry-After cuando un backend no está disponible
error:
  retryAfterSeconds: "30"
