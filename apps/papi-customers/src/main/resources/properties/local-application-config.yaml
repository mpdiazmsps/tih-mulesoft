# Configuration for the local environment (the default one).
http:
  listener:
    host: "0.0.0.0"
    port: "8082"
    basePath: "/api/v1/customers-management"

# sapi-crm (Salesforce). Locally there is no API Manager: any client_id/client_secret works. On CloudHub (T26) these
# become the credentials of the papi-customers client application, as protected properties.
sapi:
  crm:
    protocol: "HTTP"
    host: "localhost"
    port: "8094"
    basePath: "/api/v1/crm"
    # sapi-crm answers within 3 s per Salesforce call (plus its retry on connectivity): 8 s covers both
    timeoutMillis: "8000"
    clientId: "papi-customers-local"
    clientSecret: "papi-customers-local"

# Seconds suggested to the consumer in the Retry-After header when the CRM is unavailable
error:
  retryAfterSeconds: "30"
