# Configuration for the local environment (the default one). The MCP server has no secrets.
http:
  listener:
    host: "0.0.0.0"
    port: "8086"

mcp:
  serverName: "mcp-online-store"
  serverVersion: "1.0.0"
  endpointPath: "/mcp"
  requestTimeoutSeconds: "15"
  # client application of the agent when the request does not carry a client_id header (x-client-app, D10)
  defaultClientApp: "agente-mcp"

# Process APIs. Locally any client_id/client_secret works (Client ID Enforcement only exists in API Manager).
papi:
  orders:
    protocol: "HTTP"
    host: "localhost"
    port: "8083"
    basePath: "/api/v1/orders-management"
  orderRequests:
    protocol: "HTTP"
    host: "localhost"
    port: "8085"
    basePath: "/api/v1"
  timeoutMillis: "10000"
  clientId: "mcp-online-store-local"
  clientSecret: "mcp-online-store-local"
